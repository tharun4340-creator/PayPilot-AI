services:
  - type: web
    name: paypilot-ai-2050
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_DEFAULT_CURRENCY
        value: USD
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-3.8-flash
